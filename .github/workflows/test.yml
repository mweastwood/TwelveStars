name: Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  test-frontend:
    name: Frontend Tests (Flutter)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Compile database
        run: dart run bin/assemble_db.dart

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: app/test/**/failures/

  test-scripts:
    name: Script Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            scripts:
              - 'app/assets/bible/cpdv/scripts/**'
              - '.github/workflows/test.yml'

      - uses: actions/setup-python@v5
        if: steps.filter.outputs.scripts == 'true'
        with:
          python-version: '3.x'

      - name: Run CPDV generator tests
        if: steps.filter.outputs.scripts == 'true'
        run: python3 -m unittest discover app/assets/bible/cpdv/scripts
